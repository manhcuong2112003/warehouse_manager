name: WMS checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_DB: wms_test, POSTGRES_USER: wms_owner, POSTGRES_PASSWORD: ci-test-only}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U wms_owner -d wms_test" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://wms_owner:ci-test-only@localhost:5432/wms_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24, cache: npm}
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
